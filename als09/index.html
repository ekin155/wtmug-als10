<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Öğretmen — Dosya Aktarımı</title>
  <style>
    body { font-family: system-ui, sans-serif; background:#0f172a; color:#e2e8f0; margin:0; padding:16px; }
    .topbar { display:flex; align-items:center; gap:12px; margin-bottom:16px; }
    .home-btn { padding:8px 14px; background:#1e293b; color:#38bdf8; border:1px solid #334155; border-radius:10px; text-decoration:none; font-size:.9rem; }
    section { background:#1e293b; border:1px solid #334155; border-radius:12px; padding:16px; margin-bottom:16px; }
    h3 { margin:0 0 12px; color:#38bdf8; font-size:1rem; }
    button { padding:10px 16px; background:#2563eb; color:#fff; border:0; border-radius:10px; font-size:1rem; cursor:pointer; }
    button:disabled { background:#475569; cursor:default; }
    video { width:100%; max-width:360px; border-radius:12px; background:#000; margin-top:8px; }
    #qrbox, #qrbox2 { background:#fff; padding:12px; border-radius:12px; display:inline-block; margin:8px 0; min-height:40px; }
    #qrbox canvas, #qrbox2 canvas { display:block; }
    progress { width:100%; max-width:360px; display:block; margin-top:8px; }
    .id { font-family: monospace; font-size:.85rem; color:#94a3b8; word-break:break-all; }
  </style>
</head>
<body>
  <div class="topbar">
    <a class="home-btn" href="../index.html">← Ana Ekran</a>
    <h1 style="font-size:1.1rem;margin:0;">Öğretmen — Dosya Aktarımı</h1>
  </div>

  <!-- GÖNDEREN (HOCA) -->
  <section>
    <h3>Gönderen (Hoca)</h3>
    <input type="file" id="file">
    <button id="sendBtn">QR Oluştur (offer)</button>
    <div id="qrbox"></div>
    <div class="id" id="sendId"></div>
    <progress id="sendProg" value="0" max="1"></progress>
  </section>

  <!-- ALICI (ÖĞRENCİ) -->
  <section>
    <h3>Alıcı (Öğrenci)</h3>
    <button id="scanBtn">QR Tara (offer)</button>
    <video id="video" playsinline muted></video>
    <div id="qrbox2"></div>
    <div class="id" id="recvId"></div>
    <progress id="recvProg" value="0" max="1"></progress>
  </section>

  <!-- GÖNDEREN: ANSWER TARA -->
  <section>
    <h3>Gönderen: Answer QR Tara</h3>
    <button id="scanAnswerBtn">Answer QR Tara</button>
  </section>

  <script type="module">
    import { renderQR, scanQR } from '../shared/qr.js';
    import {
      createPeer, createOfferWithChannel, answerOffer, applyAnswer,
      sendFileOverChannel, receiveFileOverChannel
    } from '../shared/webrtc.js';
    import { publishSDP, fetchSDP } from '../shared/signaling.js';

    const fileInput  = document.getElementById('file');
    const sendBtn    = document.getElementById('sendBtn');
    const qrbox      = document.getElementById('qrbox');
    const sendId     = document.getElementById('sendId');
    const sendProg   = document.getElementById('sendProg');

    const scanBtn    = document.getElementById('scanBtn');
    const video      = document.getElementById('video');
    const qrbox2     = document.getElementById('qrbox2');
    const recvId     = document.getElementById('recvId');
    const recvProg   = document.getElementById('recvProg');

    const scanAnswerBtn = document.getElementById('scanAnswerBtn');

    let pc, channel;

    // GÖNDEREN
    sendBtn.onclick = async () => {
      const file = fileInput.files[0];
      if (!file) return alert('Dosya seçin');
      sendBtn.disabled = true;
      pc = createPeer();
      const { channel: ch, sdp } = await createOfferWithChannel(pc);
      channel = ch;
      sendFileOverChannel(channel, file, p => sendProg.value = p);
      const id = await publishSDP(sdp);
      sendId.textContent = 'ID: ' + id;
      await renderQR(qrbox, id);
    };

    // ALICI
    scanBtn.onclick = async () => {
      await scanQR(video, async (id) => {
        try {
          const offerSdp = await fetchSDP(id);
          pc = createPeer();
          pc.ondatachannel = (e) => {
            receiveFileOverChannel(e.channel, p => recvProg.value = p);
          };
          const answerSdp = await answerOffer(pc, offerSdp);
          const answerId  = await publishSDP(answerSdp);
          recvId.textContent = 'Answer ID: ' + answerId;
          await renderQR(qrbox2, answerId);
        } catch (err) {
          alert('Hata: ' + err.message);
        }
      });
    };

    // GÖNDEREN: ANSWER ID OKU
    scanAnswerBtn.onclick = () => {
      scanQR(video, async (answerId) => {
        try {
          const answerSdp = await fetchSDP(answerId);
          await applyAnswer(pc, answerSdp);
        } catch (err) {
          alert('Hata: ' + err.message);
        }
      });
    };
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#1e3a8a">
  <title>Öğrenci</title>
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: system-ui, sans-serif;
      background: #0f172a; color: #e2e8f0;
      margin: 0; padding: 16px;
      min-height: 100vh;
    }
    .topbar {
      display: flex; align-items: center; gap: 12px;
      margin-bottom: 16px; flex-wrap: wrap;
    }
    .home-btn {
      padding: 8px 14px;
      background: #1e293b; color: #38bdf8;
      border: 1px solid #334155; border-radius: 10px;
      text-decoration: none; font-size: .9rem;
      display: inline-flex; align-items: center;
    }
    .home-btn:active { transform: scale(.97); }
    h1 { font-size: 1.1rem; margin: 0; }
    section {
      background: #1e293b; border: 1px solid #334155;
      border-radius: 12px; padding: 16px; margin-bottom: 16px;
    }
    h3 { margin: 0 0 12px; color: #38bdf8; font-size: 1rem; }
    button {
      padding: 10px 16px; background: #2563eb; color: #fff;
      border: 0; border-radius: 10px; font-size: 1rem; cursor: pointer;
    }
    button:disabled { background: #475569; cursor: default; }
    video {
      width: 100%; max-width: 360px;
      border-radius: 12px; background: #000; margin-top: 8px;
    }
    #qrbox {
      background: #fff; padding: 12px; border-radius: 12px;
      display: inline-block; margin: 8px 0; min-height: 40px;
    }
    #qrbox canvas { display: block; }
    progress {
      width: 100%; max-width: 360px;
      display: block; margin-top: 8px;
    }
    .id {
      font-family: monospace; font-size: .85rem;
      color: #94a3b8; word-break: break-all;
    }
    .status {
      font-size: .9rem; color: #94a3b8; margin-top: 8px;
    }
  </style>
</head>
<body>

  <div class="topbar">
    <a class="home-btn" href="../index.html">← Ana Ekran</a>
    <h1>Öğrenci</h1>
  </div>

  <!-- Dosya Alıcı -->
  <section>
    <h3>Dosya Al</h3>
    <p class="status">Öğretmenin gösterdiği QR kodu okutun.</p>
    <button id="scanBtn">QR Tara</button>
    <video id="video" playsinline muted></video>
    <div id="qrbox"></div>
    <div class="id" id="answerId"></div>
    <progress id="recvProg" value="0" max="1"></progress>
    <p class="status" id="recvStatus"></p>
  </section>

  <script type="module">
    import { renderQR, scanQR } from '../shared/qr.js';
    import {
      createPeer, answerOffer,
      receiveFileOverChannel
    } from '../shared/webrtc.js';
    import { publishSDP, fetchSDP } from '../shared/signaling.js';

    const scanBtn   = document.getElementById('scanBtn');
    const video     = document.getElementById('video');
    const qrbox     = document.getElementById('qrbox');
    const answerId  = document.getElementById('answerId');
    const recvProg  = document.getElementById('recvProg');
    const recvStatus = document.getElementById('recvStatus');

    let pc;

    scanBtn.onclick = async () => {
      scanBtn.disabled = true;
      recvStatus.textContent = 'Kamera açılıyor...';

      await scanQR(video, async (id) => {
        try {
          recvStatus.textContent = 'QR okundu, bağlantı kuruluyor...';

          // QR'dan gelen kısa ID ile offer SDP'sini çek
          const offerSdp = await fetchSDP(id);

          pc = createPeer();

          // Dosya geldiğinde parçaları topla ve indir
          pc.ondatachannel = (e) => {
            receiveFileOverChannel(e.channel, (p) => {
              recvProg.value = p;
              recvStatus.textContent = 'Dosya alınıyor: %' + Math.round(p * 100);
            });
            recvStatus.textContent = 'Bağlantı kuruldu, dosya bekleniyor...';
          };

          // Answer üret
          const answerSdp = await answerOffer(pc, offerSdp);
          const newAnswerId = await publishSDP(answerSdp);

          answerId.textContent = 'Answer ID: ' + newAnswerId;
          await renderQR(qrbox, newAnswerId);

          recvStatus.textContent = 'Bu QR kodu öğretmene gösterin.';
          scanBtn.disabled = false;
        } catch (err) {
          recvStatus.textContent = 'Hata: ' + err.message;
          scanBtn.disabled = false;
        }
      });
    };
  </script>
</body>
</html>

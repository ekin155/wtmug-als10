<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#1e3a8a">
  <link rel="manifest" href="manifest.json">
  <title>Birleşik PWA</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0; font-family: system-ui, sans-serif;
      background: #0f172a; color: #e2e8f0;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      min-height: 100vh; padding: 24px;
    }
    h1 { font-size: 1.5rem; margin-bottom: 32px; text-align: center; }
    .card {
      display: block; width: 100%; max-width: 340px;
      padding: 24px; margin-bottom: 16px;
      background: #1e293b; border: 1px solid #334155;
      border-radius: 16px; text-decoration: none; color: inherit;
      transition: transform .15s, border-color .15s;
    }
    .card:active { transform: scale(.97); border-color: #38bdf8; }
    .card h2 { margin: 0 0 8px; font-size: 1.15rem; color: #38bdf8; }
    .card p { margin: 0; font-size: .85rem; color: #94a3b8; }
  </style>
</head>
<body>
  <h1>Birleşik PWA</h1>

  <a class="card" href="als08/index.html">
    <h2>ALŞ08</h2>
    <p>ALŞ08 uygulamasına gir</p>
  </a>

  <a class="card" href="als09/index.html">

    <p>ALŞ09 uygulamasına gir</p>
  </a>

  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('sw.js').catch(console.error);
    }
  </script>
</body>
</html>
